<style>
:root{
  color-scheme: light;
  --ground:#F3F6F7; --surface:#FFFFFF; --raised:#F8FAFB; --sunk:#EDF1F3;
  --ink:#0E171D; --muted:#57676F; --faint:#8494A0;
  --line:#DDE5E9; --line-soft:#EAEFF2;
  --accent:#0A6675; --accent-ink:#075260; --accent-soft:#E0F0F2;
  --pos:#0A7346; --neg:#B7392A; --warn:#8A6100; --crit:#A61E16;
  --pos-soft:#E3F3EA; --neg-soft:#FAE9E6; --warn-soft:#FAF1DC; --crit-soft:#FAE7E4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --shadow:0 1px 2px rgba(14,23,29,.05), 0 4px 16px rgba(14,23,29,.05);
  --shadow-lg:0 12px 40px rgba(14,23,29,.16);
  --r:11px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ground:#090F13; --surface:#121A20; --raised:#182229; --sunk:#0D1418;
  --ink:#E7EEF2; --muted:#95A5B0; --faint:#6D7F8C;
  --line:#213039; --line-soft:#1A272F;
  --accent:#5CC4D4; --accent-ink:#8CDAE5; --accent-soft:#0F2E38;
  --pos:#45C088; --neg:#F07C6E; --warn:#E0AA3E; --crit:#FF8779;
  --pos-soft:#0D2920; --neg-soft:#2D1613; --warn-soft:#29200F; --crit-soft:#2F1412;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.32), 0 6px 22px rgba(0,0,0,.26);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#090F13; --surface:#121A20; --raised:#182229; --sunk:#0D1418;
  --ink:#E7EEF2; --muted:#95A5B0; --faint:#6D7F8C;
  --line:#213039; --line-soft:#1A272F;
  --accent:#5CC4D4; --accent-ink:#8CDAE5; --accent-soft:#0F2E38;
  --pos:#45C088; --neg:#F07C6E; --warn:#E0AA3E; --crit:#FF8779;
  --pos-soft:#0D2920; --neg-soft:#2D1613; --warn-soft:#29200F; --crit-soft:#2F1412;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 1px 2px rgba(0,0,0,.32), 0 6px 22px rgba(0,0,0,.26);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
.num,td.n,th.n,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* header */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);
  border-bottom:1px solid var(--line);padding:11px clamp(13px,3.5vw,30px);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:31px;height:31px;border-radius:8px;flex:none;display:block}
.brand .nm{font-family:"IBM Plex Serif",Georgia,serif;font-size:16.5px;
  font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand .tag{font-size:11px;color:var(--faint);letter-spacing:.04em;
  text-transform:uppercase;font-weight:600}
.headline{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.headline .v{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:21px;font-weight:600;letter-spacing:-.025em}
.headline .k{font-size:11px;color:var(--faint);font-weight:600}
.iconbtn{appearance:none;background:var(--surface);border:1px solid var(--line);
  color:var(--muted);width:34px;height:34px;border-radius:9px;cursor:pointer;
  display:grid;place-items:center;font-size:15px;flex:none}
.iconbtn:hover{border-color:var(--accent);color:var(--accent-ink)}

/* tabs */
.tabs{position:sticky;top:0;z-index:29;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;gap:2px;
  padding:0 clamp(8px,3.5vw,26px);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

[role="tabpanel"][hidden]{display:none}
.stack{display:flex;flex-direction:column;gap:16px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);

.card>header .sub{font-size:12.5px;color:var(--muted);margin-left:auto}
.card .body{padding:15px 16px}

.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);

  font-size:24px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.tile .note{font-size:11.5px;color:var(--muted)}
.tile.hl{border-color:var(--accent)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;text-align:left;white-space:nowrap}
thead th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);

tbody tr{border-bottom:1px solid var(--line-soft)}
tbody tr:last-child{border-bottom:0}
tbody tr:hover{background:var(--raised)}
td.n,th.n{text-align:right}
.tick{font-family:"IBM Plex Mono",monospace;font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.dim{color:var(--faint)}.wm{color:var(--muted)}
tr.grouphead td{background:var(--sunk);font-weight:600;font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted)}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
.pill.ok{background:var(--pos-soft);color:var(--pos);border-color:var(--pos)}
.pill.mute{background:var(--sunk);color:var(--muted);border-color:var(--line)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.alert{display:flex;gap:11px;padding:11px 14px;border-left:3px solid var(--line);
  background:var(--raised);border-radius:0 7px 7px 0;align-items:flex-start}
.alert+.alert{margin-top:8px}
.alert.critical{border-left-color:var(--crit);background:var(--crit-soft)}
.alert.high{border-left-color:var(--neg);background:var(--neg-soft)}
.alert.medium{border-left-color:var(--warn);background:var(--warn-soft)}
.alert.good{border-left-color:var(--pos);background:var(--pos-soft)}
.alert .ico{font-family:"IBM Plex Mono",monospace;font-weight:700;flex:none;width:17px;

.alert.critical .ico{color:var(--crit)}.alert.high .ico{color:var(--neg)}
.alert.medium .ico{color:var(--warn)}.alert.good .ico{color:var(--pos)}

.alert .d{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:normal}

.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.link{border:0;background:none;color:var(--accent-ink);padding:4px 6px}
.rowbtns{display:flex;gap:6px;justify-content:flex-end}

.toolbar .lab{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;

.chip{appearance:none;background:var(--surface);border:1px solid var(--line);color:var(--muted);

/* ============================================================ derived */
const acct = id => S.accounts.find(a=>a.id===id);
const acctName = id => (acct(id)||{}).name || "—";
const priceOf = t => S.prices[t] != null ? S.prices[t] : null;
const holdingsOf = id => S.holdings.filter(h=>h.acct===id);
const lotQty = h => h.lots.reduce((s,l)=>s+num(l.qty),0);
const lotBasis = h => h.lots.reduce((s,l)=>s+num(l.qty)*num(l.cost),0);
const avgCost = h => { const q=lotQty(h); return q?lotBasis(h)/q:0; };
function mktValue(h){ const p=priceOf(h.ticker); return p==null?lotBasis(h):lotQty(h)*p; }
function unreal(h){ return mktValue(h)-lotBasis(h); }
const openTrades = ()=> S.trades.filter(t=>!t.exitDate);
const closedTrades = ()=> S.trades.filter(t=>t.exitDate);
const exitedTrades = ()=> S.trades.filter(t=>t.exitDate && t.outcome!=="promoted");
function tradePnl(t, live){
  const px = t.exitDate ? num(t.exitPrice) : (live!=null?live:priceOf(t.ticker));
  if(px==null) return null;
  return (px-num(t.entryPrice))*num(t.qty) - num(t.fees||0);
}
function tradePct(t,live){ const p=tradePnl(t,live), b=num(t.entryPrice)*num(t.qty);
  return p==null||!b?null:p/b*100; }
function tradeR(t,live){ if(t.stop==null||t.stop==="") return null;
  const risk=(num(t.entryPrice)-num(t.stop))*num(t.qty); if(risk<=0) return null;
  const p=tradePnl(t,live); return p==null?null:p/risk; }
function holdDays(t){ return dayDiff(t.entryDate, t.exitDate||today()); }
function logLag(t){ if(!t.closedAt||!t.exitDate) return null;
  return dayDiff(t.exitDate, t.closedAt.slice(0,10)); }
function acctValue(id){
  const a=acct(id); if(!a) return 0;
  let v=num(a.cash);
  holdingsOf(id).forEach(h=>{v+=mktValue(h);});
  openTrades().filter(t=>t.acct===id).forEach(t=>{
    const p=priceOf(t.ticker); v += num(t.qty)*(p==null?num(t.entryPrice):p);});
  return v;
}
const totalValue = ()=> S.accounts.reduce((s,a)=>s+acctValue(a.id),0);
const totalUnreal = ()=> S.holdings.reduce((s,h)=>s+unreal(h),0)
  + openTrades().reduce((s,t)=>s+(tradePnl(t)||0),0);
const totalRealized = ()=> exitedTrades().reduce((s,t)=>s+(tradePnl(t)||0),0);
function missingPrices(){
  const need=new Set();
  S.holdings.forEach(h=>{ if(priceOf(h.ticker)==null) need.add(h.ticker); });
  openTrades().forEach(t=>{ if(priceOf(t.ticker)==null) need.add(t.ticker); });
  return [...need];
}
/* money-weighted benchmark shadow: same contributions, index returns */
function shadowSeries(){
  const H=S.history, B=S.bench;
  if(!H.length) return [];
  const bmap={}; B.forEach(b=>bmap[b.m]=num(b.c));
  const out=[]; let sh=num(H[0].v);
  for(let i=0;i<H.length;i++){
    if(i>0){
      const c0=bmap[H[i-1].m], c1=bmap[H[i].m];
      const r = (c0&&c1)? c1/c0 : 1;
      sh = (sh + num(H[i].f||0)) * r;
    }
    out.push(sh);
  }
  return out;
}
function stats(list){
  const c=list.filter(t=>tradePnl(t)!=null);
  const s={n:c.length,wins:0,losses:0,total:0,avg:null,winRate:null,pf:null,
           avgWin:null,avgLoss:null,best:null,worst:null,hold:null,holdW:null,
           holdL:null,avgR:null,roc:null};
  if(!c.length) return s;
  const p=c.map(t=>tradePnl(t));
  const W=c.filter(t=>tradePnl(t)>0), L=c.filter(t=>tradePnl(t)<0);
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  s.wins=W.length; s.losses=L.length;
  s.total=p.reduce((a,b)=>a+b,0); s.avg=mean(p);
  s.winRate=(W.length+L.length)?W.length/(W.length+L.length)*100:null;
  s.avgWin=mean(W.map(t=>tradePnl(t))); s.avgLoss=mean(L.map(t=>tradePnl(t)));
  const gw=W.reduce((a,t)=>a+tradePnl(t),0), gl=Math.abs(L.reduce((a,t)=>a+tradePnl(t),0));
  s.pf=gl?gw/gl:null;
  s.best=Math.max(...p); s.worst=Math.min(...p);
  s.hold=mean(c.map(holdDays)); s.holdW=mean(W.map(holdDays)); s.holdL=mean(L.map(holdDays));
  const rs=c.map(t=>tradeR(t)).filter(v=>v!=null); s.avgR=mean(rs);
  const cap=c.reduce((a,t)=>a+num(t.entryPrice)*num(t.qty),0);
  s.roc=cap?s.total/cap*100:null;
  return s;
}
/* benchmark over each trade's own window */
function benchRet(from,to){
  const bmap={}; S.bench.forEach(b=>bmap[b.m]=num(b.c));
  const a=bmap[monthOf(from)], b=bmap[monthOf(to)];
  return (a&&b)? (b-a)/a*100 : null;
}
function benchReport(list,label){
  const rows=list.filter(t=>tradePct(t)!=null).map(t=>{
    const tr=tradePct(t), br=benchRet(t.entryDate,t.exitDate);
    return {t,tr,br,alpha:br==null?null:tr-br,cap:num(t.entryPrice)*num(t.qty)};
  });
  const cap=rows.reduce((s,r)=>s+r.cap,0);
  const tp=rows.reduce((s,r)=>s+(tradePnl(r.t)||0),0);
  const bp=rows.reduce((s,r)=>s+(r.br==null?0:r.cap*r.br/100),0);
  const decided=rows.filter(r=>r.alpha!=null);
  const tpct=cap?tp/cap*100:null, bpct=cap?bp/cap*100:null;
  const alpha=(tpct==null||bpct==null)?null:tpct-bpct;
  return {label,n:rows.length,rows,cap,tradePnl:tp,benchPnl:bp,edge:tp-bp,
    tradePct:tpct,benchPct:bpct,alpha,
    hit:decided.length?decided.filter(r=>r.alpha>0).length/decided.length*100:null,
    verdict: alpha==null?"not enough data": alpha>2?"picking is paying"
      : alpha>=-2?"a wash — the index would have done this"
      : "the index would have done better"};
}

  finnhub:{name:"Finnhub", site:"finnhub.io/register",
    quote:(t,k)=>`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(t)}&token=${k}`,
    readQuote:j=> j && j.c ? j.c : null,
    candles:(t,k)=>{const to=Math.floor(Date.now()/1e3), from=to-86400*365*8;
      return `https://finnhub.io/api/v1/stock/candle?symbol=${encodeURIComponent(t)}&resolution=M&from=${from}&to=${to}&token=${k}`;},
    readCandles:j=> (j&&j.s==="ok"&&j.t)? j.t.map((ts,i)=>(
      {m:new Date(ts*1e3).toISOString().slice(0,7), c:j.c[i]})) : null},
  twelvedata:{name:"Twelve Data", site:"twelvedata.com/pricing",
    quote:(t,k)=>`https://api.twelvedata.com/price?symbol=${encodeURIComponent(t)}&apikey=${k}`,
    readQuote:j=> j && j.price ? parseFloat(j.price) : null,
    candles:(t,k)=>`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(t)}&interval=1month&outputsize=100&apikey=${k}`,
    readCandles:j=> (j&&j.values)? j.values.map(v=>({m:v.datetime.slice(0,7),
      c:parseFloat(v.close)})).reverse() : null},
  alphavantage:{name:"Alpha Vantage", site:"alphavantage.co/support/#api-key",
    quote:(t,k)=>`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${encodeURIComponent(t)}&apikey=${k}`,
    readQuote:j=>{const q=j&&j["Global Quote"];return q&&q["05. price"]?parseFloat(q["05. price"]):null;},
    candles:(t,k)=>`https://www.alphavantage.co/query?function=TIME_SERIES_MONTHLY_ADJUSTED&symbol=${encodeURIComponent(t)}&apikey=${k}`,
    readCandles:j=>{const s=j&&j["Monthly Adjusted Time Series"]; if(!s) return null;
      return Object.keys(s).sort().map(d=>({m:d.slice(0,7),
        c:parseFloat(s[d]["5. adjusted close"])}));}},
};
function apiCfg(){ return S.settings.api || {provider:"finnhub", key:"", benchSymbol:"SPY"}; }
async function fetchJSON(url){
  const r = await fetch(url,{mode:"cors"});
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
async function refreshPrices(){
  const cfg=apiCfg(), P=PROVIDERS[cfg.provider];
  if(!cfg.key) throw new Error("Add an API key in Setup first");
  const tickers=[...new Set([...S.holdings.map(h=>h.ticker),
    ...openTrades().map(t=>t.ticker)])];
  let ok=0, fail=[];
  for(const t of tickers){
    try{ const v=P.readQuote(await fetchJSON(P.quote(t,cfg.key)));
      if(v){ S.prices[t]=+v.toFixed(4); ok++; } else fail.push(t); }
    catch(e){ fail.push(t); }
  }
  S.settings.lastFetch=new Date().toISOString();
  save();
  return {ok, fail, total:tickers.length};
}
async function refreshBenchmark(){
  const cfg=apiCfg(), P=PROVIDERS[cfg.provider];
  if(!cfg.key) throw new Error("Add an API key in Setup first");
  const rows=P.readCandles(await fetchJSON(P.candles(cfg.benchSymbol||"SPY",cfg.key)));
  if(!rows||!rows.length) throw new Error("No history returned for "+(cfg.benchSymbol||"SPY"));
  const byM={}; S.bench.forEach(b=>byM[b.m]=b.c);
  rows.forEach(r=>{ if(r.c) byM[r.m]=+r.c.toFixed(2); });
  S.bench=Object.keys(byM).sort().map(m=>({m,c:byM[m]}));
  S.settings.lastBenchFetch=new Date().toISOString();
  save();
  return rows.length;
}

let RANGE = 96;
function growthChart(){
  const H=S.history;
  if(H.length<2) return `<div class="empty">No value history yet.<br>
    <button class="btn primary" onclick="openHistory()">Add monthly values</button></div>`;
  const shadow=shadowSeries();
  const n=Math.min(RANGE,H.length);
  const hist=H.slice(-n), sh=shadow.slice(-n);
  const narrow = window.innerWidth < 720;
  const W=narrow?430:940, Hh=narrow?300:330;
  const PL=narrow?52:68, PR=narrow?16:104, PT=16, PB=narrow?42:34;
  const iw=W-PL-PR, ih=Hh-PT-PB;
  const vals=[...hist.map(h=>num(h.v)),...sh];
  let min=Math.min(...vals), max=Math.max(...vals);
  const pad=(max-min)*0.09||1; min=Math.max(0,min-pad); max=max+pad;
  const x=i=>PL+(i/(n-1||1))*iw, y=v=>PT+ih-((v-min)/(max-min||1))*ih;
  const ticks=[0,.25,.5,.75,1].map(f=>min+(max-min)*f);
  const fmt=v=> v>=1e6?"$"+(v/1e6).toFixed(2)+"M":"$"+Math.round(v/1000)+"K";
  const lab=narrow?10:12;
  const line=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const you=num(hist[hist.length-1].v), idx=sh[sh.length-1];
  // keep the two end labels from overlapping
  let yA=y(you), yB=y(idx);
  if(Math.abs(yA-yB)<17){ const mid=(yA+yB)/2; if(yA<=yB){yA=mid-9;yB=mid+9;} else {yA=mid+9;yB=mid-9;} }
  const step=Math.max(1,Math.ceil(n/(narrow?4:7)));
  const xt=[]; for(let i=0;i<n;i+=step) xt.push(i);
  if(xt[xt.length-1]!==n-1){ if(n-1-xt[xt.length-1]<step*0.55) xt.pop(); xt.push(n-1); }
  return `<div class="chartwrap" id="growth">
    <svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img"
      aria-label="Total account value versus the ${esc(S.settings.benchName)} over ${(n/12).toFixed(0)} years">
      <g class="grid">${ticks.map(t=>`<line x1="${PL}" x2="${PL+iw}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
      <g class="axis">${ticks.map(t=>`<text x="${PL-10}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")}</g>
      <g class="axis">${xt.map(i=>`<text x="${x(i)}" y="${Hh-(narrow?22:10)}"
        text-anchor="middle" style="font-size:${narrow?10:11}px">${hist[i].m}</text>`).join("")}</g>
      <path class="series" d="${line(sh)}" stroke="var(--s2)" stroke-dasharray="6 4"/>
      <path class="series" d="${line(hist.map(h=>num(h.v)))}" stroke="var(--s1)"/>
      <circle cx="${x(n-1)}" cy="${y(idx)}" r="4.5" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/>
      <circle cx="${x(n-1)}" cy="${y(you)}" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>
      ${narrow?`
      <text x="${PL}" y="${Hh-6}" fill="var(--s1)" style="font-family:'IBM Plex Mono',monospace;
        font-size:11.5px;font-weight:600">You ${fmt(you)}</text>
      <text x="${PL+iw}" y="${Hh-6}" text-anchor="end" fill="var(--s2)"
        style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600">Index ${fmt(idx)}</text>`
      :`<text x="${x(n-1)+11}" y="${yA+4}" fill="var(--s1)" style="font-family:'IBM Plex Mono',monospace;
        font-size:${lab}px;font-weight:600">You ${fmt(you)}</text>
      <text x="${x(n-1)+11}" y="${yB+4}" fill="var(--s2)" style="font-family:'IBM Plex Mono',monospace;
        font-size:${lab}px;font-weight:600">Index ${fmt(idx)}</text>`}
      <line class="hoverline" id="gx" x1="0" x2="0" y1="${PT}" y2="${PT+ih}" style="opacity:0"/>
      <rect id="ghit" x="${PL}" y="${PT}" width="${iw}" height="${ih}" fill="transparent"/>
    </svg><div class="tip" id="gtip"></div></div>`;
}
function wireGrowth(){
  const wrap=$("#growth"); if(!wrap) return;
  const svg=wrap.querySelector("svg"), tip=$("#gtip"), cross=$("#gx"), hit=$("#ghit");
  const H=S.history, shadow=shadowSeries();
  const n=Math.min(RANGE,H.length), hist=H.slice(-n), sh=shadow.slice(-n);
  const narrow=window.innerWidth<720;
  const W=narrow?430:940, PL=narrow?52:68, PR=narrow?16:104, iw=W-PL-PR;
  const at=e=>{
    const r=svg.getBoundingClientRect();
    const cx=(e.touches?e.touches[0].clientX:e.clientX);
    let i=Math.round(((cx-r.left)/r.width*W-PL)/iw*(n-1));
    i=Math.max(0,Math.min(n-1,i));
    const gx=PL+(i/(n-1||1))*iw;
    cross.setAttribute("x1",gx); cross.setAttribute("x2",gx); cross.style.opacity=1;
    const you=num(hist[i].v), idx=sh[i], gap=you-idx;
    tip.innerHTML=`<div class="h">${hist[i].m}</div>
      <div class="r"><span><i class="swatch ln" style="background:var(--s1)"></i>You</span>
        <b>${money(you)}</b></div>
      <div class="r"><span><i class="swatch ln" style="background:var(--s2)"></i>${esc(S.settings.benchName)}</span>
        <b>${money(idx)}</b></div>
      <div class="r" style="margin-top:4px;border-top:1px solid var(--line-soft);padding-top:4px">
        <span>Difference</span><b class="${cls(gap)}">${signed(gap)}</b></div>`;
    tip.classList.add("on");
    const left=(gx/W)*r.width;
    tip.style.left=Math.min(r.width-180,Math.max(0,left+14))+"px";
    tip.style.top="10px";
  };
  hit.addEventListener("mousemove",at);
  hit.addEventListener("touchstart",at,{passive:true});
  hit.addEventListener("touchmove",at,{passive:true});
  const off=()=>{tip.classList.remove("on");cross.style.opacity=0;};
  hit.addEventListener("mouseleave",off);
  hit.addEventListener("touchend",off);
}

function overlaps(){
  const TAX=["taxable"], RET=["roth","ira","401k"];
  const legs={};
  S.holdings.forEach(h=>{ if(lotQty(h)<=0) return;
    (legs[h.ticker]=legs[h.ticker]||[]).push({acct:h.acct,kind:"holding",
      qty:lotQty(h),value:mktValue(h)});});
  openTrades().forEach(t=>{ const p=priceOf(t.ticker);
    (legs[t.ticker]=legs[t.ticker]||[]).push({acct:t.acct,kind:"trade",
      qty:num(t.qty),value:num(t.qty)*(p==null?num(t.entryPrice):p)});});
  const out=[];
  Object.keys(legs).forEach(tk=>{
    const L=legs[tk], accts=[...new Set(L.map(l=>l.acct))];
    const kinds=[...new Set(L.map(l=>l.kind))];
    if(accts.length<2 && kinds.length<2) return;
    const types=accts.map(id=>(acct(id)||{}).type);
    const crit=types.some(t=>TAX.includes(t)) && types.some(t=>RET.includes(t));
    out.push({ticker:tk,legs:L,accts,crit,
      value:L.reduce((s,l)=>s+l.value,0),
      sev: crit?"critical" : kinds.length>1?"high":"medium"});
  });
  return out.sort((a,b)=>({critical:0,high:1,medium:2}[a.sev]-{critical:0,high:1,medium:2}[b.sev])
    || b.value-a.value);
}
function attention(){
  const items=[];
  const ov=overlaps(), crit=ov.filter(o=>o.sev==="critical");
  if(crit.length) items.push(`<div class="alert critical"><span class="ico">!!</span><div class="txt">
    <div class="t">${crit.length} name${crit.length>1?"s sit":" sits"} in a taxable account and a retirement account</div>
    <div class="d">${crit.map(o=>`<b>${esc(o.ticker)}</b>`).join(", ")} — selling at a loss in the
      taxable account while an IRA or 401(k) buys the same name inside 30 days permanently disallows
      the loss, rather than deferring it. Keep each name in one account.</div></div></div>`);
  ov.filter(o=>o.sev==="high").forEach(o=>items.push(
    `<div class="alert high"><span class="ico">!</span><div class="txt">
      <div class="t">${esc(o.ticker)} is both a holding and an open trade</div>
      <div class="d">Exiting the trade quietly trims the long-term position too.</div></div></div>`));
  openTrades().forEach(t=>{
    const p=priceOf(t.ticker); if(p==null) return;
    if(t.stop!=null&&t.stop!==""&&p<=num(t.stop))
      items.push(`<div class="alert high"><span class="ico">▼</span><div class="txt">
        <div class="t">${esc(t.ticker)} is at or below its stop</div>
        <div class="d">Stop ${money(num(t.stop),2)}, last ${money(p,2)}. Still marked open —
          close it so the record stays honest.</div></div></div>`);
    else if(t.target!=null&&t.target!==""&&p>=num(t.target))
      items.push(`<div class="alert good"><span class="ico">▲</span><div class="txt">
        <div class="t">${esc(t.ticker)} reached its target</div>
        <div class="d">Target ${money(num(t.target),2)}, last ${money(p,2)}.</div></div></div>`);
    const d=holdDays(t);
    if(d>num(S.settings.staleDays))
      items.push(`<div class="alert medium"><span class="ico">◷</span><div class="txt">
        <div class="t">${esc(t.ticker)} has been open ${d} days</div>
        <div class="d">Past your ${S.settings.staleDays}-day horizon. Close it, or move it to
          Holdings if it became a long-term position.</div></div></div>`);
  });
  const lags=closedTrades().map(logLag).filter(v=>v!=null);
  if(lags.length){
    const W=exitedTrades().filter(t=>tradePnl(t)>0).map(logLag).filter(v=>v!=null);
    const L=exitedTrades().filter(t=>tradePnl(t)<0).map(logLag).filter(v=>v!=null);
    const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
    const mw=mean(W), ml=mean(L);
    if(mw!=null&&ml!=null&&ml-mw>1) items.push(
      `<div class="alert medium"><span class="ico">◇</span><div class="txt">
        <div class="t">Losers get logged ${ (ml-mw).toFixed(1) } days slower than winners</div>
        <div class="d">Winners ${days(mw)}, losers ${days(ml)}. Close dates are stamped when you
          record the exit, so this gap is measured rather than guessed — and it is the usual way a
          win rate drifts away from the truth.</div></div></div>`);
  }
  if(!items.length) items.push(`<div class="alert good"><span class="ico">✓</span><div class="txt">
    <div class="t">Nothing needs attention</div>
    <div class="d">No account overlaps, no stalled trades, nothing through a stop.</div></div></div>`);
  const clean = items.length===1 && items[0].indexOf("alert good")>-1
    && items[0].indexOf("Nothing needs attention")>-1;
  return `<div class="card"><header><h2>Needs attention</h2>
    <span class="sub">${crit.length?`<span class="pill crit">${crit.length} to fix</span>`
      : clean?`<span class="pill ok">all clear</span>`
      :`<span class="pill warn">${items.length} to look at</span>`}</span></header>
    <div class="body">${items.join("")}</div></div>`;
}
function syncThisMonth(){
  const m=monthOf(today()), v=+totalValue().toFixed(2);
  const row=S.history.find(h=>h.m===m);
  if(row) row.v=v; else S.history.push({m,v,f:0});
  S.history.sort((a,b)=>a.m<b.m?-1:1);
  commit("History updated for "+m);
}

function renderHold(){
  const accts=S.accounts;
  const list=S.holdings.filter(h=>holdFilter==="all"||h.acct===holdFilter);
  const total=S.holdings.reduce((s,h)=>s+mktValue(h),0);

function monthBars(rows){
  const narrow=window.innerWidth<720;
  const W=narrow?430:760, H=190, PL=narrow?48:60, PR=14, PT=12, PB=30;
  const iw=W-PL-PR, ih=H-PT-PB;
  const vals=rows.map(r=>r.total);
  const max=Math.max(...vals,0), min=Math.min(...vals,0), span=(max-min)||1;
  const y=v=>PT+ih-((v-min)/span)*ih, step=iw/rows.length;
  const bw=Math.min(44,step*0.6), zero=y(0);
  const ticks=[...new Set([max,(max+min)/2,min])];
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Realized profit and loss by month">
    <g class="grid">${ticks.map(t=>`<line x1="${PL}" x2="${W-PR}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
    <g class="axis">${ticks.map(t=>`<text x="${PL-8}" y="${y(t)+4}" text-anchor="end">${
      (t>=0?"+":"−")+"$"+Math.abs(Math.round(t)).toLocaleString()}</text>`).join("")}</g>
    <line x1="${PL}" x2="${W-PR}" y1="${zero}" y2="${zero}" stroke="var(--line)"/>
    ${rows.map((r,i)=>{const cx=PL+step*i+step/2,h=Math.abs(y(r.total)-zero);
      return `<rect x="${cx-bw/2}" y="${r.total>=0?y(r.total):zero}" width="${bw}"
        height="${Math.max(2,h)}" rx="3" fill="${r.total>=0?"var(--pos)":"var(--neg)"}">
        <title>${r.m}: ${signed(r.total)} across ${r.n} trade${r.n>1?"s":""}</title></rect>`;}).join("")}
    <g class="axis">${rows.map((r,i)=>`<text x="${PL+step*i+step/2}" y="${H-9}"
      text-anchor="middle">${r.m.slice(2)}</text>`).join("")}</g></svg></div>`;
}

/* ============================================================ PLANNER */
let PLAN={start:null,contrib:12000,years:20,reinvest:true};
let FUNDS=[{t:"VOO",n:"Vanguard S&P 500",er:0.03,dy:1.25,tr:10.1},
           {t:"SPY",n:"SPDR S&P 500",er:0.0945,dy:1.20,tr:10.1},
           {t:"SCHD",n:"Schwab Dividend",er:0.06,dy:3.50,tr:9.0}];
const SV=["--s1","--s2","--s3","--s4"];
function project(f,start,years,contrib,reinvest){
  let bal=start, rows=[], y0=new Date().getFullYear();
  const er=f.er/100, dy=f.dy/100, price=f.tr/100-dy;
  for(let i=0;i<years;i++){
    const inv=bal+contrib, divs=inv*dy, growth=inv*price, fees=(inv+growth)*er;
    bal=inv+growth-fees+(reinvest?divs:0);
    rows.push({year:y0+i,divs,fees,end:bal});
  }
  return {f,rows,end:bal,fees:rows.reduce((s,r)=>s+r.fees,0),
    divs:rows.reduce((s,r)=>s+r.divs,0),lastDiv:rows.length?rows[rows.length-1].divs:0};
}

        </tbody></table></div>

          the long-run average costs <b>${money(P[0].end-project({...FUNDS[0],tr:FUNDS[0].tr-3},
          PLAN.start,PLAN.years,PLAN.contrib,PLAN.reinvest).end)}</b> here — which is the argument
          for keeping deposits steady rather than trying to pick the moment.</div></div>
      </div></div>`;
  const bind=(id,k)=>{const e=$(id); if(e) e.onchange=()=>{PLAN[k]=Math.max(0,num(e.value));renderPlan();};};
  bind("#pl-s","start"); bind("#pl-c","contrib"); bind("#pl-y","years");
  const r=$("#pl-r"); if(r) r.onchange=()=>{PLAN.reinvest=r.value==="1";renderPlan();};
}
function planChart(P){
  const narrow=window.innerWidth<720;
  const W=narrow?430:760, H=narrow?250:260, PL=narrow?50:64, PR=narrow?54:88, PT=14, PB=30;
  const iw=W-PL-PR, ih=H-PT-PB, n=P[0].rows.length;
  const max=Math.max(...P.flatMap(p=>p.rows.map(r=>r.end)));
  const x=i=>PL+(i/(n-1||1))*iw, y=v=>PT+ih-(v/(max||1))*ih;
  const ticks=[0,.25,.5,.75,1].map(f=>max*f);
  const fmt=v=> v>=1e6?"$"+(v/1e6).toFixed(1)+"M":"$"+Math.round(v/1000)+"K";
  const pts=P.map((p,k)=>({k,t:p.f.t,v:p.rows[n-1].end,y:y(p.rows[n-1].end)}))
             .sort((a,b)=>a.y-b.y);
  for(let i=1;i<pts.length;i++) if(pts[i].y-pts[i-1].y<15) pts[i].y=pts[i-1].y+15;
  const step=Math.max(1,Math.ceil(n/(narrow?4:7))); const xt=[];
  for(let i=0;i<n;i+=step) xt.push(i);
  if(xt[xt.length-1]!==n-1){ if(n-1-xt[xt.length-1]<step*0.55) xt.pop(); xt.push(n-1); }
  return `<div class="chartwrap"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
      aria-label="Projected balance by year for ${P.map(p=>p.f.t).join(", ")}">
    <g class="grid">${ticks.map(t=>`<line x1="${PL}" x2="${PL+iw}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>
    <g class="axis">${ticks.map(t=>`<text x="${PL-9}" y="${y(t)+4}" text-anchor="end">${fmt(t)}</text>`).join("")}</g>
    <g class="axis">${xt.map(i=>`<text x="${x(i)}" y="${H-9}" text-anchor="middle">${P[0].rows[i].year}</text>`).join("")}</g>
    ${P.map((p,k)=>`<path class="series" d="${p.rows.map((r,i)=>(i?"L":"M")+x(i).toFixed(1)+" "
      +y(r.end).toFixed(1)).join(" ")}" stroke="var(${SV[k]})"/>`).join("")}
    ${pts.map(pt=>`<circle cx="${x(n-1)}" cy="${y(pt.v)}" r="4" fill="var(${SV[pt.k]})"
      stroke="var(--surface)" stroke-width="2"/>
      <text x="${x(n-1)+10}" y="${pt.y+4}" fill="var(${SV[pt.k]})"
        style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:600">${esc(pt.t)}</text>`).join("")}
  </svg></div>`;
}

function modal(title, bodyHTML, footHTML){

    aria-modal="true" aria-label="${esc(title)}">
    <header><h2>${esc(title)}</h2><span style="margin-left:auto"></span>

      <button class="btn" onclick="closeModal()">Close</button>`}</footer></div></div>`;
  $("#scrim").addEventListener("mousedown",e=>{ if(e.target.id==="scrim") closeModal(); });
  document.addEventListener("keydown",escClose);
  const f=host.querySelector("input,select,textarea"); if(f) f.focus();
}

      <label class="f">Close<input type="number" step="0.01" id="nb-c"></label>
      <label class="f" style="justify-content:flex-end">
        <button class="btn primary" onclick="addBench()">Add</button></label></div></div></div>
    <div class="sect"><h3>Paste</h3><div class="sbody">
      <div class="note" style="margin-bottom:8px"><code>2026-01, 5420.10</code> per line.</div>
      <textarea id="bench-paste" placeholder="2026-01, 5420.10"></textarea>
      <button class="btn sm" style="margin-top:8px" onclick="pasteBench()">Import rows</button>
    </div></div>`,
    `<span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn primary" onclick="saveBench()">Save changes</button>`);
}
function saveBench(){
  document.querySelectorAll("[data-bm]").forEach(i=>{
    const r=S.bench.find(b=>b.m===i.dataset.bm); if(r) r.c=num(i.value);});
  closeModal(); commit("Index history saved");
}
function addBench(){ const m=val("#nb-m"), c=num(val("#nb-c")); if(!m||!c) return;
  const r=S.bench.find(b=>b.m===m); if(r) r.c=c; else S.bench.push({m,c});
  S.bench.sort((a,b)=>a.m<b.m?-1:1); save(); openBench(); renderAll(); toast("Added"); }
function delBench(m){ S.bench=S.bench.filter(b=>b.m!==m); save(); openBench(); renderAll(); }
function pasteBench(){
  const txt=val("#bench-paste"); if(!txt) return; let n=0;
  txt.split(/\r?\n/).forEach(line=>{
    const p=line.split(/[,\t;]/).map(s=>s.trim()).filter(Boolean); if(p.length<2) return;
    const m=p[0].slice(0,7); if(!/^\d{4}-\d{2}$/.test(m)) return;
    const r=S.bench.find(b=>b.m===m); const c=num(p[1]);
    if(r) r.c=c; else S.bench.push({m,c}); n++;});
  S.bench.sort((a,b)=>a.m<b.m?-1:1); save(); closeModal(); renderAll();
  toast(n+" month"+(n===1?"":"s")+" imported");
}

/* ---------------------------------------------------------- setup */
function openSetup(focus){
  const cfg=apiCfg();
  modal("Setup",`
    <div class="sect"><h3>Accounts</h3><div class="sbody">
      ${S.accounts.map(a=>`<div style="display:flex;gap:9px;align-items:center;
        padding:7px 0;border-bottom:1px solid var(--line-soft)">
        <b>${esc(a.name)}</b><span class="pill mute">${esc(a.type)}</span>
        <span class="mono dim" style="margin-left:auto">${money(acctValue(a.id))}</span>
        <button class="btn sm" onclick="editAccount('${a.id}')">Edit</button></div>`).join("")
        || `<div class="note">No accounts yet.</div>`}
      <button class="btn sm primary" style="margin-top:10px" onclick="editAccount()">+ Add account</button>
    </div></div>

    <div class="sect"><h3>Automatic market data</h3><div class="sbody">
      <div class="note" style="margin-bottom:10px">When this app is published with the bundled
        GitHub Action, prices and index history are refreshed on a schedule and read from a file
        beside the page — nothing for you to do. The API key below is only a fallback for running
        the page somewhere without that workflow.</div>
      <div class="fields">
        <label class="f">Data file
          <input id="st-feed" value="${esc(cfg.feed||"./data/market.json")}" placeholder="./data/market.json"></label>
        <label class="f">Index symbol<input id="st-bs" value="${esc(cfg.benchSymbol||"SPY")}"></label>
        <label class="f">Index name<input id="st-bn" value="${esc(S.settings.benchName)}"></label>
      </div>
      <div class="fields" style="margin-top:11px">
        <label class="f">Fallback provider<select id="st-prov">
          ${Object.keys(PROVIDERS).map(k=>`<option value="${k}"${cfg.provider===k?" selected":""}>
            ${PROVIDERS[k].name}</option>`).join("")}</select></label>
        <label class="f">API key <span class="hint">optional, stays in this browser</span>
          <input id="st-key" value="${esc(cfg.key||"")}" placeholder="paste key"></label>
      </div>
      <div style="display:flex;gap:8px;margin-top:11px;flex-wrap:wrap">
        <button class="btn sm" onclick="fetchNow()">Fetch now</button>
        <button class="btn sm" onclick="openPrices()">Enter prices by hand</button>
      </div>
      <div class="note" style="margin-top:9px" id="fetch-status">${
        S.settings.lastFetch?`Last updated ${esc(S.settings.lastFetch.slice(0,16).replace("T"," "))}.`
        :"Not fetched yet."}</div>
    </div></div>

    <div class="sect"><h3>Data</h3><div class="sbody">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="openHistory()">Monthly values</button>
        <button class="btn sm" onclick="openBench()">Index history</button>
        <button class="btn sm" onclick="exportJSON()">Export backup</button>
        <button class="btn sm" onclick="importJSON()">Import backup</button>
      </div>
      <div class="hr"></div>
      <div class="fields">
        <label class="f">Swing horizon <span class="hint">days before a trade is flagged as stalled</span>
          <input type="number" id="st-stale" value="${num(S.settings.staleDays)}"></label>
        <label class="f">Late logging <span class="hint">days before an exit counts as late</span>
          <input type="number" id="st-late" value="${num(S.settings.lateDays)}"></label>
        <label class="f">Snapshot this month automatically
          <select id="st-auto">
            <option value="1"${S.settings.autoSnapshot!==false?" selected":""}>Yes</option>
            <option value="0"${S.settings.autoSnapshot===false?" selected":""}>No</option></select></label>
      </div>
      <div class="hr"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="resetDemo()">Restore demo data</button>
        <button class="btn sm danger" onclick="if(confirm('Erase everything and start empty?')) clearAll()">
          Erase everything</button>
      </div>
      <div class="note" style="margin-top:9px">Everything lives in this browser's local storage.
        Clearing site data removes it, so export a backup if it matters.</div>
    </div></div>`,
    `<span class="sp"></span><button class="btn primary" onclick="saveSetup()">Save</button>`);
  if(focus==="data") setTimeout(()=>{const e=$("#st-stale"); if(e) e.scrollIntoView({block:"center"});},60);
}
function saveSetup(){
  S.settings.benchName=val("#st-bn")||"S&P 500";
  S.settings.staleDays=num(val("#st-stale"))||120;
  S.settings.lateDays=num(val("#st-late"))||3;
  S.settings.autoSnapshot=val("#st-auto")==="1";
  S.settings.api={...apiCfg(),provider:val("#st-prov"),key:val("#st-key"),
    benchSymbol:val("#st-bs")||"SPY",feed:val("#st-feed")||"./data/market.json"};
  closeModal(); commit("Setup saved");
}
async function fetchNow(){
  const st=$("#fetch-status"); const say=m=>{ if(st) st.textContent=m; else toast(m); };
  say("Fetching…");
  try{
    const fed = await loadFeed(true);
    if(fed){ say(`Updated from the published data file (${fed} tickers).`);
      renderAll(); return; }
    const r=await refreshPrices();
    let msg=`${r.ok} of ${r.total} prices updated`;
    try{ const n=await refreshBenchmark(); msg+=`, ${n} months of index history`; }catch(e){}
    if(r.fail.length) msg+=` — no data for ${r.fail.join(", ")}`;
    say(msg); autoSnapshot(); renderAll();
  }catch(e){ say("Couldn't fetch: "+e.message+
    ". Enter prices by hand, or publish with the bundled workflow for automatic updates."); }
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  modal("Backup",`<div class="note">Copy this, or right-click the link and save it.</div>
    <textarea readonly style="min-height:220px">${esc(JSON.stringify(S))}</textarea>
    <a class="btn" href="${url}" download="investing-console-backup.json">Download file</a>`);
}
function importJSON(){
  modal("Import backup",`<div class="note">Paste a backup. This replaces everything currently stored.</div>
    <textarea id="imp" placeholder='{"accounts":[...]}'></textarea>`,
    `<span class="sp"></span><button class="btn" onclick="closeModal()">Cancel</button>
     <button class="btn primary" onclick="doImport()">Replace my data</button>`);
}
function doImport(){
  try{ const p=JSON.parse(val("#imp"));
    if(!p||!p.accounts) throw new Error("that doesn't look like a backup");
    S=p; save(); closeModal(); renderAll(); toast("Backup restored");
  }catch(e){ toast("Import failed: "+e.message); }
}

/* ---------------------------------------------------------- auto feed */
async function loadFeed(manual){
  const cfg=apiCfg(), url=cfg.feed||"./data/market.json";
  try{
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok) return null;
    const j=await r.json();
    let n=0;
    if(j.prices){ Object.keys(j.prices).forEach(k=>{ S.prices[k]=j.prices[k]; n++; }); }
    if(j.benchmark && j.benchmark.length){
      const byM={}; S.bench.forEach(b=>byM[b.m]=b.c);
      j.benchmark.forEach(b=>{ if(b.c) byM[b.m]=b.c; });
      S.bench=Object.keys(byM).sort().map(m=>({m,c:byM[m]}));
    }
    if(j.benchName) S.settings.benchName=j.benchName;
    S.settings.lastFetch=j.updated||new Date().toISOString();
    S.settings.api={...cfg,auto:true};
    autoSnapshot(); save();
    return n;
  }catch(e){ return null; }
}
function autoSnapshot(){
  if(S.settings.autoSnapshot===false) return;
  if(!S.holdings.length && !S.accounts.length) return;
  const m=monthOf(today()), v=+totalValue().toFixed(2);
  if(!v) return;
  const r=S.history.find(h=>h.m===m);
  if(r) r.v=v; else S.history.push({m,v,f:0});
  S.history.sort((a,b)=>a.m<b.m?-1:1);
}

/* ---------------------------------------------------------- boot */
function renderAll(){
  $("#hlv").textContent=money(totalValue());
  $("#hlk").textContent=S.accounts.length+" account"+(S.accounts.length===1?"":"s");
  const fd=$("#foot-data");
  if(fd) fd.textContent = (S.settings.api&&S.settings.api.auto)
    ? "Prices and index history update themselves from the published data file."
    : "Prices are yours to set here, or published automatically by the bundled workflow.";
  $("#brandtag").textContent = S.demo ? "demo data"
    : (S.settings.api&&S.settings.api.auto) ? "auto-updating" : "your data";
  renderDash(); renderHold(); renderTrade(); renderPerf(); renderPlan();
}
$("#btn-setup").onclick=()=>openSetup();
let _rz; addEventListener("resize",()=>{clearTimeout(_rz);
  _rz=setTimeout(()=>{renderDash(); renderPlan(); renderPerf();},180);});
renderAll();
try{ const t=localStorage.getItem(KEY+":tab"); if(t&&TABS.some(([x])=>x===t)) selectTab(t); }catch(e){}
loadFeed().then(n=>{ if(n){ renderAll(); toast("Market data updated"); } });
</script>
</body>
</html>
